# act --container-architecture linux/amd64 -j test

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (transformers ${{ matrix.transformers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["<5", ">=5"]

    steps:
      - uses: actions/checkout@v6

      # conda-forge ships the latest Pango, cairo and PyGObject
      - name: Setup rendering stack
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: pixel
          create-args: -c conda-forge python=3.12 pango pycairo pygobject
          cache-downloads: true

      - name: Install dependencies
        shell: bash -el {0}
        run: pip install ".[dev,pangocairo]" "transformers${{ matrix.transformers }}"

      - name: Rendering stack versions
        shell: bash -el {0}
        run: micromamba list -n pixel "^(pango|cairo|harfbuzz|pygobject|pycairo)$"

      - name: Test code
        shell: bash -el {0}
        run: pytest -n auto --dist loadscope
